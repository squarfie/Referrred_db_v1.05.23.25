{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Batch label {{ receipt.tracking_number }}</title><link rel="stylesheet" href="{% static 'assets/css/receiving.css' %}"></head>
<body class="receiving-label-page">
  <div class="receiving-label-toolbar screen-only"><button type="button" class="btn btn-primary" onclick="window.print()">Print batch label</button></div>
  <main class="receiving-label"><div class="receiving-label-mark">Batch Isolates</div><img src="{% url 'receiving_qr' receipt.receiving_id %}?v=scan-receive" alt="QR code for receiving batch {{ receipt.tracking_number }}"><div class="receiving-label-tracking">{{ receipt.tracking_number }}</div><div class="receiving-label-meta">Site: <strong>{{ receipt.site.SiteCode }}</strong></div><div class="receiving-label-meta">Received: <strong>{{ receipt.date_received|date:"N j, Y" }}</strong></div><div class="receiving-label-meta">Scan to receive or resume</div><div class="receiving-label-uuid">{{ receipt.receiving_id }}</div></main>
</body></html>
