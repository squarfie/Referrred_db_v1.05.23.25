{% comment %}Site-reported organism picker. Used in the revival and Site ID forms. Values are copied from the sentinel site's referral form.{% endcomment %}
<div class="lab-organism-picker site-id-picker" data-organism-picker data-allow-unlisted data-endpoint="{% url 'laboratory_organism_search' %}">
  <label for="site-organism-search">Site-reported organism <span class="site-id-accession">{{ isolate.accession_number }}</span></label>
  <input id="site-organism-search" data-organism-search type="search" autocomplete="off" maxlength="255" class="form-control" value="{% if site_id %}{{ site_id.0 }} {{ site_id.1 }}{% endif %}" placeholder="Search by organism name or WHONET code" aria-describedby="site-organism-hint">
  <div class="organism-picker-results" data-organism-results role="listbox" hidden></div>

  <span class="site-id-caption">Selected site identification</span>
  <div class="organism-picker-pair site-id-pair">
    <input data-organism-code name="site_organism_code" value="{{ site_id.0|default:'' }}" class="form-control" readonly aria-label="Site WHONET code" placeholder="Code">
    <input data-organism-name name="site_organism_name" value="{{ site_id.1|default:'' }}" class="form-control" readonly aria-label="Site organism name" placeholder="Nothing selected yet">
  </div>

  <p id="site-organism-hint" class="site-id-hint"><i class="fas fa-info-circle" aria-hidden="true"></i><span>Copy the sentinel site's identification. Main Lab records its confirmatory ID separately.</span></p>
</div>
