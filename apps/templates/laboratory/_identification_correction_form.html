<details class="mb-3">
  <summary>Correct {% if correction_kind == 'site' %}Site ID{% elif correction_kind == 'final' %}Final ID{% else %}this Main Lab result{% endif %}</summary>
  <form method="post" action="{% url 'laboratory_identification_correct' isolate.pk %}" class="mt-3">
    {% csrf_token %}<input type="hidden" name="next" value="{{ return_to }}">
    <input type="hidden" name="kind" value="{{ correction_kind }}">
    {% if correction_result %}<input type="hidden" name="result_id" value="{{ correction_result.pk }}">{% endif %}
    <p class="small text-muted">Previous values remain in history. A Main Lab result correction leaves the confirmed Final ID unchanged.</p>
    <div class="lab-organism-picker" data-organism-picker data-endpoint="{% url 'laboratory_organism_search' %}">
      <label>Corrected organism (search code or name)</label>
      <input class="form-control" type="search" data-organism-search placeholder="Search organism code or name" aria-label="Corrected organism search">
      <div class="organism-picker-results" data-organism-results role="listbox" hidden></div>
      <div class="organism-picker-pair">
        <input class="form-control" name="organism_code" data-organism-code readonly required aria-label="Corrected organism code">
        <input class="form-control" name="organism_name" data-organism-name readonly required aria-label="Corrected organism name">
      </div>
    </div>
    <label class="mt-3">Correction reason<textarea class="form-control" name="reason" required maxlength="1000"></textarea></label>
    <button type="submit" class="btn btn-outline-primary">Save correction</button>
  </form>
</details>
